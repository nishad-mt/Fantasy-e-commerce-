{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Artisanal Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'fantasy-cream': '#FFF9F0',
            'fantasy-walnut': '#5a3e2b',
            'fantasy-gold': '#D4AF37',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 1s ease-out forwards',
            'slide-up': 'slideUp 0.8s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-fantasy-cream via-[#f8f1e6] to-[#e8dcc5] relative overflow-hidden font-sans">

  <!-- Background Texture -->
  <div class="absolute inset-0 z-0 opacity-30"
    style="background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');"></div>

  <!-- Glassmorphism Card -->
  <div
    class="w-full max-w-lg bg-white/80 backdrop-blur-lg border border-white/20 rounded-[2rem] shadow-2xl p-8 md:p-12 relative z-10 animate-fade-in text-center">

    <div class="mb-8">
      <div
        class="w-20 h-20 bg-fantasy-walnut/5 rounded-full flex items-center justify-center mx-auto mb-6 text-fantasy-walnut shadow-inner">
        <i data-lucide="lock-keyhole" class="w-10 h-10"></i>
      </div>
      <h2 class="text-3xl font-serif font-bold text-fantasy-walnut mb-3">Trouble Logging In?</h2>
      <p class="text-gray-500 font-sans leading-relaxed">Enter your email address and we’ll send you a secure link to
        reset your password.</p>
    </div>

    <!-- Form -->
    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <!-- Email Input -->
      <div class="relative group text-left">
        <input type="email" name="email" id="email" placeholder=" " class="peer w-full pl-4 pr-10 pt-6 pb-2 rounded-xl border border-gray-300 bg-white/60 text-fantasy-walnut font-medium
                        focus:outline-none focus:ring-2 focus:ring-fantasy-gold/50 focus:border-fantasy-gold 
                        focus:bg-white transition-all duration-300 placeholder-transparent shadow-sm" required>
        <label for="email" class="absolute left-4 top-2 text-xs font-bold text-gray-400 transition-all 
                        peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 
                        peer-focus:top-2 peer-focus:text-xs peer-focus:text-fantasy-gold pointer-events-none">Email
          Address</label>
        <i data-lucide="mail" class="absolute right-3 top-4 text-gray-400 w-5 h-5"></i>
      </div>

      <button type="submit"
        class="w-full bg-fantasy-walnut text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-fantasy-walnut/20 
                     hover:bg-fantasy-gold hover:text-fantasy-walnut hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2 animate-slide-up">
        Send Reset Link <i data-lucide="send" class="w-5 h-5"></i>
      </button>
    </form>

    <div class="mt-8 animate-slide-up" style="animation-delay: 0.1s;">
      <a href="{% url 'login' %}"
        class="inline-flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-fantasy-walnut transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back the Login
      </a>
      <p class="mt-4 text-sm text-gray-400">
        Don't have an account? <a href="{% url 'signup' %}"
          class="text-fantasy-walnut font-bold hover:text-fantasy-gold transition-colors">Sign up</a>
      </p>
    </div>

  </div>

  <!-- Status Modal -->
  <div id="statusModal"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div
      class="bg-white rounded-[2rem] shadow-2xl p-8 max-w-sm w-full text-center transform scale-95 transition-transform duration-300 border border-white/20">
      <div
        class="w-16 h-16 bg-fantasy-cream rounded-full flex items-center justify-center mx-auto mb-4 text-fantasy-gold shadow-sm">
        <i data-lucide="mail-check" class="w-8 h-8"></i>
      </div>
      <h3 class="text-2xl font-serif font-bold text-fantasy-walnut mb-2" id="modalTitle">Link Sent!</h3>
      <p class="text-gray-600 mb-8 font-sans leading-relaxed" id="modalMessage">Check your email inbox.</p>
      <button onclick="closeModal()"
        class="w-full bg-fantasy-walnut text-white py-3.5 rounded-xl font-bold hover:bg-fantasy-gold hover:text-fantasy-walnut transition-all duration-300 shadow-lg shadow-fantasy-walnut/20">Okay</button>
    </div>
  </div>

  <script>
    // Modal Logic
    const modal = document.getElementById('statusModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');

    function showModal(title, message) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
        modal.querySelector('div').classList.add('scale-100');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modal.querySelector('div').classList.remove('scale-100');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      {% if messages %}
      {% for message in messages %}
      {% if 'success' in message.tags %}
      showModal("Link Sent!", "Your reset password link has been sent. Check your email inbox.");
      {% else %}
      showModal("Notification", "{{ message }}");
      {% endif %}
      {% endfor %}
      {% endif %}
    });
  </script>
</body>

</html>
